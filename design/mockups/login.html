<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden — Werkstattportal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" data-od-id="app-header">
  <div class="app-header-inner">
    <a class="brand" href="index.html" data-od-id="brand-link">Werkstattportal</a>
    <div class="header-right">
      <a class="btn btn-text header-actions-desktop" href="index.html" data-od-id="nav-kunden">Kundenbereich</a>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="mobile-panel" aria-label="Menü öffnen" data-od-id="nav-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <nav class="mobile-panel" id="mobile-panel" aria-label="Bereiche">
    <a href="index.html">Kundenbereich</a>
  </nav>
</header>

<main class="login-main container" data-od-id="main">
  <div class="card login-card" data-od-id="login-card" style="width:100%">
    <div class="card-header" style="justify-content:center;text-align:center">
      <h1 class="card-title" style="font-size:24px" data-od-id="login-title">Werkstattbereich</h1>
    </div>
    <form id="loginForm" class="card-stack" novalidate data-od-id="login-form">
      <div class="field" data-od-id="field-email">
        <label for="loginEmail">E-Mail<span class="required-marker">erforderlich</span></label>
        <input type="email" id="loginEmail" inputmode="email" autocomplete="email">
        <p class="field-error" id="err-loginEmail" hidden></p>
      </div>
      <div class="field" data-od-id="field-password">
        <label for="loginPassword">Passwort<span class="required-marker">erforderlich</span></label>
        <input type="password" id="loginPassword" autocomplete="current-password">
        <p class="field-error" id="err-loginPassword" hidden></p>
      </div>
      <button type="submit" class="btn btn-primary" id="submitLogin" data-od-id="btn-login">
        <span class="btn-label">Anmelden</span>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </form>
  </div>
</main>

<footer class="app-footer" data-od-id="app-footer">
  <div class="app-footer-inner">
    <div class="footer-meta">© 2026 Kfz-Service Berger GmbH</div>
    <nav class="footer-links" aria-label="Rechtliches">
      <a href="legal-notice.html" data-od-id="footer-impressum">Impressum</a>
      <a href="privacy.html" data-od-id="footer-datenschutz">Datenschutzerklärung</a>
    </nav>
  </div>
</footer>

<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitLogin');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail');
    var pass = document.getElementById('loginPassword');
    var okEmail = wk.checkField(email, 'Bitte eine gültige E-Mail-Adresse angeben.');
    var okPass = wk.checkField(pass, 'Bitte das Passwort angeben.');
    if (!okEmail || !okPass) return;

    wk.setLoading(btn, true);
    setTimeout(function () {
      window.location.href = 'dashboard.html';
    }, 600);
  });
})();
</script>
</body>
</html>
